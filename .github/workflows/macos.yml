name: macOS (Qt6) build

# Phase 0 of the native macOS port: build the Qt6/CMake macOS client on every
# push/PR. Produces an ad-hoc-signed .app artifact. If the Developer-ID signing
# secrets are configured, it additionally signs + notarizes a DMG.
#
# Required repository secrets for full signing/notarization (all optional —
# without them the job still builds and ad-hoc signs):
#   MACOS_CERT_P12_BASE64   base64 of the Developer ID Application .p12
#   MACOS_CERT_P12_PASSWORD password for that .p12
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: X2Go (TEAMID)"
#   AC_API_KEY_ID           App Store Connect API key id (notarytool)
#   AC_API_ISSUER_ID        App Store Connect issuer id
#   AC_API_KEY_BASE64       base64 of the AuthKey_*.p8

on:
  push:
    branches: [ master ]
    paths: [ 'src/**', 'res/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/macos.yml' ]
  pull_request:
    paths: [ 'src/**', 'res/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/macos.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14            # Apple Silicon runner
    env:
      # Match the project's deployment floor.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      # Exposed at job level so the signing steps can gate on `env.<name> != ''`
      # (the `secrets` context isn't usable directly in step `if:` conditions).
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install qt libssh openssl@3

      - name: Configure
        run: |
          cmake -S . -B build-mac \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}"

      - name: Build
        run: cmake --build build-mac -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test (launches without crashing)
        run: |
          QT_QPA_PLATFORM=offscreen timeout 5 \
            build-mac/x2goclient.app/Contents/MacOS/x2goclient || \
            test "$?" = "124"   # 124 = still running after timeout = OK

      # --- Optional: Developer ID signing + notarization -------------------
      # Runs only when the signing secrets are present.
      - name: Import signing certificate
        id: signing
        if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"

      - name: Sign, build DMG, and notarize
        if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          APP="build-mac/x2goclient.app"
          # Bundle Qt frameworks into the .app so it runs off-machine.
          "$(brew --prefix qt)/bin/macdeployqt" "$APP" -always-overwrite
          # Deep sign with hardened runtime.
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # Create DMG.
          hdiutil create -volname x2goclient -srcfolder "$APP" \
            -ov -format UDZO build-mac/x2goclient.dmg
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" build-mac/x2goclient.dmg
          # Notarize with notarytool (App Store Connect API key).
          echo "$AC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit build-mac/x2goclient.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple build-mac/x2goclient.dmg

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: x2goclient-macos-arm64
          path: |
            build-mac/x2goclient.app
            build-mac/x2goclient.dmg
          if-no-files-found: warn
